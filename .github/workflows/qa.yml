name: WeConnect QA Verification Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js 20 (HTML JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Static HTML, DOM, Handler & Route Audit
        run: python audit_html_pages.py

      - name: Run Full PyTest QA Suite (Offline / Non-Live)
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-ephemeral-test-secret-key-min-32-chars-2026
          ADMIN_API_KEY: ci-ephemeral-admin-api-key-2026
          CRON_SECRET: ci-ephemeral-cron-secret-2026
        run: python -m pytest -m "not live" -q --tb=short
